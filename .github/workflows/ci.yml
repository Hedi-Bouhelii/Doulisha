name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrations match the schema
        run: pnpm --filter @doulisha/db exec drizzle-kit check

      - name: Build
        run: pnpm build
        env:
          # No database or auth secrets in this job; pages that need them are dynamic.
          SKIP_ENV_VALIDATION: '1'

  # One Neon branch per pull request: migrate, seed, then run the E2E suite.
  # Skipped until the repository has the NEON_API_KEY secret and NEON_PROJECT_ID
  # variable (docs/DEPLOYMENT.md).
  e2e:
    name: E2E on a Neon branch
    if: github.event_name == 'pull_request' && vars.NEON_PROJECT_ID != ''
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
          parent_branch: production
          database: Doulisha
          role: neondb_owner

      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          NEON_BRANCH: preview/pr-${{ github.event.number }}
        run: |
          pnpm --filter @doulisha/db db:migrate
          pnpm --filter @doulisha/db db:seed

      - name: Install Playwright browser
        run: pnpm --filter @doulisha/web exec playwright install --with-deps chromium

      - name: E2E tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI }}
          CI: '1'
        run: pnpm --filter @doulisha/web e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
