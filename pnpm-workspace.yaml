packages:
  - apps/*
  - packages/*

# React Native libraries do not all support isolated node_modules yet.
# See docs/decisions/0001-monorepo-pnpm-turborepo.md.
nodeLinker: hoisted

# Shared versions: reference them with "catalog:" in package.json files.
catalog:
  '@types/node': ^24.13.6
  eslint: ^9.39.5
  prettier: ^3.9.0
  turbo: ^2.11.3
  typescript: ~6.0.3
  vitest: ^5.0.1
  zod: ^4.6.5

# Packages allowed (true) or refused (false) to run install scripts.
# unrs-resolver ships prebuilt binaries, so its script is not needed.
allowBuilds:
  unrs-resolver: false

# Keep one React 19.2 type version across web and mobile
# (expo-router's Radix dependencies would otherwise pull @types/react-dom 19.3).
overrides:
  '@types/react-dom': ~19.2.2
