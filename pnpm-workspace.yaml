packages:
  - apps/*
  - packages/*

# Shared versions: reference them with "catalog:" in package.json files.
catalog:
  '@types/node': ^24.13.6
  eslint: ^9.39.5
  prettier: ^3.9.0
  turbo: ^2.11.3
  typescript: ~6.0.3
  vitest: ^5.0.1
  zod: ^4.6.5

# Packages allowed (true) or refused (false) to run install scripts.
# unrs-resolver ships prebuilt binaries, so its script is not needed.
allowBuilds:
  unrs-resolver: false
